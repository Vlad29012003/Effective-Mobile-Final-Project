{% extends "base.html" %}
{% block title %}Регистрация — TeamFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-diagram-3-fill text-primary" style="font-size:2.5rem"></i>
      <h3 class="fw-bold mt-2">TeamFlow</h3>
      <p class="text-muted">Управление командой и задачами</p>
    </div>

    <div class="card p-4">
      <h5 class="card-title mb-4 fw-bold">Создать аккаунт</h5>

      {% if error %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
      </div>
      {% endif %}

      <form method="post" action="/web/auth/register">
        <div class="row g-3 mb-3">
          <div class="col">
            <label class="form-label fw-semibold">Имя</label>
            <input type="text" name="first_name" class="form-control" placeholder="Иван">
          </div>
          <div class="col">
            <label class="form-label fw-semibold">Фамилия</label>
            <input type="text" name="last_name" class="form-control" placeholder="Иванов">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control"
                 placeholder="you@example.com" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Пароль</label>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" required minlength="8">
          <div class="form-text">Минимум 8 символов</div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="bi bi-person-plus me-1"></i>Зарегистрироваться
        </button>
      </form>
    </div>

    <p class="text-center mt-3 text-muted small">
      Уже есть аккаунт?
      <a href="/web/auth/login" class="text-decoration-none fw-semibold">Войти</a>
    </p>
  </div>
</div>
{% endblock %}
