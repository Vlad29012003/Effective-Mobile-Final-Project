<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TeamFlow{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/web/static/css/main.css" rel="stylesheet">
</head>
<body>

{% if user %}
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/web/dashboard">
    <i class="bi bi-diagram-3-fill me-1"></i>TeamFlow
  </a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small">
      <i class="bi bi-person-circle me-1"></i>
      {{ user.get('first_name') or user.get('email', '') }}
    </span>
    <form method="post" action="/web/auth/logout" class="m-0">
      <button class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-right me-1"></i>Выход
      </button>
    </form>
  </div>
</nav>
{% endif %}

<div class="container-lg py-4">

  {% if error %}
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  {% if success %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>{{ success }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
