[project]
name = "final-project"
version = "0.1.0"
description = "Team & Task Management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.16.5",

    # Dependency injection
    "dishka>=1.6.0",

    # Configuration
    "pydantic-settings>=2.6.0",
    "email-validator>=2.3.0",

    # Security / Auth
    "PyJWT>=2.9.0",
    "itsdangerous>=2.2.0",

    # Caching
    "redis>=6.4.0",

    # HTTP client
    "httpx[http2]>=0.28.1",

    # Admin panel
    "sqladmin>=0.16.1",
    "jinja2>=3.1.4",

    # Observability
    "sentry-sdk>=2.0.0",
    "json-logify>=0.1.2",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.12.12",
    "types-redis>=4.6.0.20241004",
    "testcontainers>=4.8.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "C4", "T20", "UP"]
ignore = ["E501", "UP046", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["admin", "apps", "packages", "configs", "di", "framework", "startup", "presentations"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
disable_error_code = ["no-any-return"]
exclude = [
    "src/packages/db/alembic/",
]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "pydantic_settings",
    "sqlalchemy",
    "sqlalchemy.*",
    "alembic",
    "dishka",
    "dishka.*",
    "httpx",
    "json_logify",
    "json_logify.*",
    "uvicorn",
    "sentry_sdk",
    "sentry_sdk.*",
    "starlette",
    "starlette.*",
    "pytest",
    "pytest.*",
    "sqladmin",
    "sqladmin.*",
    "jwt",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
skips = ["B101"]
